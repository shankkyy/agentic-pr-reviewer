# Local convenience only. The app runs fine without Docker (see README).
# Mock mode by default: no API key required.
services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/reviews.db
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - reviews-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  reviews-data:
